<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition - Carregador</title>

    <style>
        .carregador-t {
            margin: 2rem;
            width: 50px;
            height: 50px;
            border: 5px solid transparent;
            border-color: #999 transparent #999 transparent;
            border-radius: 50%;
            box-shadow: 0 0 1rem rgb(0 0 255 / 40%);
            position: relative;

            /* Transição */
            transition: transform 1.5s linear;
        }

        .carregador-t::after {
            content: '⚙️';
            position: absolute;
            top: 50%;
            left: 50%;

            /* Começa invisível e pequeno */
            transform: translate(-50%, -50%) scale(0);

            /* Transição */
            transition: transform 1.5s ease-in-out;

            font-size: 2rem;
        }

        /* Quando passar o mouse */
        .carregador-t:hover {
            transform: rotate(360deg);
        }

        .carregador-t:hover::after {
            transform: translate(-50%, -50%) scale(1.5);
        }
    </style>
</head>

<body>

    <h1>Passe o mouse sobre o carregador</h1>

    <div class="carregador-t"></div>

</body>

</html>
